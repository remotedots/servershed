[project]
name = "servershed"
version = "0.1.0"
description = "Local, read-only overview of VPSes and shared-hosting accounts (TUI first)"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "textual>=8",
    "pydantic>=2",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest", "watchfiles"]

[project.scripts]
servershed = "servershed.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"servershed.core" = ["probe.sh"]
"servershed.tui" = ["app.tcss"]
